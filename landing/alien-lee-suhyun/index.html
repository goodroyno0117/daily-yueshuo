<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>每日乐说 · 李秀贤《ALIEN》</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, #1a0a2e 0%, #2d0a4e 60%, #4a1078 100%);
  color: #f0e6ff;
  min-height: 100vh;
  padding: 40px 20px 60px;
  line-height: 1.6;
}
.container { max-width: 480px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 36px; }
.brand {
  font-size: 12px; letter-spacing: 4px; color: #ffb3e6; text-transform: uppercase; margin-bottom: 12px;
}
.title { font-size: 28px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
.subtitle { font-size: 14px; color: #d4b3ff; margin-bottom: 20px; }
.year-badge {
  display: inline-block; padding: 4px 14px; border-radius: 100px;
  background: rgba(255, 179, 230, 0.15); border: 1px solid rgba(255, 179, 230, 0.4);
  font-size: 12px; color: #ffc1eb; letter-spacing: 1px;
}
.intro {
  background: rgba(255, 255, 255, 0.04); border-left: 3px solid #ffb3e6;
  padding: 16px 18px; margin: 24px 0; border-radius: 4px; font-size: 14px; color: #e8d4f5;
}
.buttons { display: flex; flex-direction: column; gap: 12px; margin: 28px 0; }
.btn {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-radius: 12px; text-decoration: none;
  font-size: 16px; font-weight: 500; transition: transform 0.15s, box-shadow 0.15s;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4); }
.btn-qq {
  background: linear-gradient(135deg, #2cbb1a 0%, #25a516 100%); color: #fff;
}
.btn-netease {
  background: linear-gradient(135deg, #d63a3a 0%, #b71c1c 100%); color: #fff;
}
.btn-label { display: flex; align-items: center; gap: 10px; }
.btn-icon { font-size: 20px; }
.btn-arrow { font-size: 18px; opacity: 0.7; }
.meta {
  margin-top: 36px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.08);
  font-size: 12px; color: #a290c4; text-align: center; line-height: 1.8;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">每日乐说 · Daily Yueshuo</div>
    <h1 class="title">李秀贤 (Lee Suhyun)<br>《ALIEN》</h1>
    <div class="subtitle">那年她染了一头薄荷粉,把自己唱成了地球的客人</div>
    <div class="year-badge">2020 · 6 周年</div>
  </div>
  <div class="intro">
    2020-10-16 发行。AKMU 妹妹李秀贤 solo 出道,词曲制作哥哥李灿赫,YG 罕见 6 周年依旧被乐评重提的"被组合身份遮住的真正主角"。
  </div>
  <div class="buttons">
    <a class="btn btn-qq" href="https://y.qq.com/n/ryqq/songDetail/002H2A2j2uDKQs" target="_blank">
      <div class="btn-label"><span class="btn-icon">♫</span><span>QQ 音乐</span></div>
      <span class="btn-arrow">→</span>
    </a>
    <a class="btn btn-netease" href="https://music.163.com/song?id=1487540562" target="_blank">

      <span class="btn-arrow">→</span>
    </a>

  <div class="meta">
    每天一首流行音乐 · 公众号《每日乐说》<br>
    链接仅供试听,版权归原唱片公司所有

</div>
