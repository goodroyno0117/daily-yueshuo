<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Fire - Funeral | 每日乐说</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a12;
      color: #f0ece4;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { max-width: 480px; width: 100%; text-align: center; }
    .album-cover {
      width: 220px; height: 220px;
      background: linear-gradient(135deg, #1a3a5c, #2a1a4a);
      border-radius: 16px;
      margin: 0 auto 32px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .album-cover span { font-size: 48px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: 1px; }
    .artist { color: #b0a898; font-size: 15px; margin-bottom: 32px; }
    .year { color: #8a8070; font-size: 13px; margin-bottom: 40px; }
    .section-title { font-size: 12px; letter-spacing: 3px; color: #6a6050; text-transform: uppercase; margin-bottom: 20px; }
    .buttons { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      padding: 16px 24px; border-radius: 50px;
      font-size: 16px; font-weight: 600;
      text-decoration: none; color: #fff;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-qq { background: #1daa1d; box-shadow: 0 6px 24px rgba(29,170,29,0.35); }
    .btn-netease { background: #C20C0C; box-shadow: 0 6px 24px rgba(194,12,12,0.35); }
    .btn-kugou { background: #0aa; box-shadow: 0 6px 24px rgba(0,170,170,0.35); }
    .btn-icon { width: 22px; height: 22px; margin-right: 10px; }
    .footer { margin-top: 48px; color: #4a4540; font-size: 12px; }
    .footer a { color: #7a756d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="album-cover"><span>🔥</span></div>
    <h1>Funeral</h1>
    <p class="artist">Arcade Fire</p>
    <p class="year">2004 · 加拿大独立摇滚</p>

    <p class="section-title">立即播放</p>
    <div class="buttons">
      <a class="btn btn-qq" href="https://y.qq.com/n/ryqq/songDetail/003AE3CI0aHGmE">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        QQ音乐
      </a>
      <a class="btn btn-netease" href="https://music.163.com/song?id=3883307">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        网易云音乐
      </a>
    </div>

    <p class="footer" style="margin-top:40px;">
      <a href="https://mp.weixin.qq.com/">关注每日乐说</a> · 每天一首歌
    </p>
  </div>
</body>
</html>
