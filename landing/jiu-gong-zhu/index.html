<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后弦《九公主》二十周年 | 每日乐说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a2015 0%, #2d3a24 50%, #3b4a2f 100%);
    color: #F5F1EA;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .meta {
    color: #A8B89A;
    font-size: 12px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  h1 {
    font-size: 34px;
    font-weight: 700;
    color: #F5F1EA;
    margin-bottom: 8px;
    line-height: 1.2;
  }
  .artist {
    color: #C8D4A8;
    font-size: 18px;
    margin-bottom: 36px;
    font-weight: 500;
  }
  .quote {
    color: #A8B89A;
    font-size: 15px;
    line-height: 1.8;
    margin-bottom: 48px;
    padding: 0 12px;
    font-style: italic;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 18px 24px;
    margin-bottom: 16px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    transition: transform 0.2s, opacity 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-qq {
    background: #11cd6c;
    color: #fff;
  }
  .btn-ne {
    background: #C20C0C;
    color: #fff;
  }
  .footer {
    margin-top: 48px;
    color: #6B7D60;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .badge {
    display: inline-block;
    background: rgba(200,212,168,0.15);
    border: 1px solid #C8D4A8;
    color: #C8D4A8;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 24px;
  }
  .divider {
    width: 40px;
    height: 2px;
    background: #4A5E3A;
    margin: 0 auto 32px;
    border-radius: 2px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="badge">20TH ANNIVERSARY</div>
  <div class="meta">大陆 · 2000s · R&C</div>
  <h1>九公主</h1>
  <div class="artist">后弦 &nbsp;·&nbsp; 2006</div>
  <div class="divider"></div>
  <div class="quote">球面上舞会在飘荡，<br>射手座血统合理冲撞。</div>
  <a class="btn btn-qq" href="https://y.qq.com/n/ryqq/songDetail/002XGRQH3XljVx">QQ音乐 · 立即收听</a>
  <a class="btn btn-ne" href="https://music.163.com/song?id=92307">网易云音乐 · 立即收听</a>
  <div class="footer">每日乐说 &nbsp;·&nbsp; 每天一首流行音乐</div>
</div>
</body>
</html>
