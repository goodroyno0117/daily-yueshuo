<!DOCTYPE html>

<head>

<title>九月九的酒 &middot; 每日乐说</title>
<style>
  body { margin:0; padding:0; background:#15120F; color:#F3EDE3;
         font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  body::before { content:''; position:fixed; inset:0;
         background:radial-gradient(130% 90% at 68% 4%, rgba(198,142,64,0.20), transparent 56%),

         pointer-events:none; }
  .wrap { max-width:520px; width:100%; padding:52px 28px; position:relative; z-index:1; }
  .brand { font-size:11px; letter-spacing:4px; color:#9B917F; margin-bottom:24px; }
  .ticket { display:inline-block; font-size:10px; letter-spacing:2px; color:#15120F;
            background:#D9C79C; padding:4px 10px; border-radius:4px; margin:0 0 22px; font-weight:700; }

  .artist { font-size:15px; color:#D9A441; font-weight:700; margin:0 0 22px; letter-spacing:2px; }
  .meta { font-size:12.5px; color:#A79C8B; line-height:2; margin:0 0 34px; }
  .rule { height:1px; background:linear-gradient(90deg,#C68E40,transparent); margin:0 0 34px; }
  .quote { font-size:16px; line-height:2; color:#F3EDE3; margin:0 0 42px;
           border-left:2px solid #D9C79C; padding-left:16px; }
  .btn { display:block; text-decoration:none; border-radius:12px; padding:18px 20px;
         margin-bottom:14px; text-align:center; font-size:16px; font-weight:700; }
  .btn-qq { background:#31C27C; color:#0B0B0B; }
  .btn-ne { background:#C62D2D; color:#fff; }
  .foot { margin-top:38px; font-size:11px; color:#6E6659; letter-spacing:1px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">DAILY MUSIC &middot; 每日乐说</div>
  <span class="ticket">NO. 20261117 &middot; 重阳</span>

  <p class="artist">陈少华 &middot; 1994</p>

  作词 陈树 &middot; 作曲 朱德荣 &middot; 演唱 陈少华<br>
