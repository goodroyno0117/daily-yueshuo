<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R.E.M. - Man on the Moon | 每日乐说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0a0a12 0%, #0d1b2a 40%, #1b263b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px 28px 36px;
    max-width: 380px;
    width: 100%;
    backdrop-filter: blur(10px);
    text-align: center;
  }
  .moon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #e8d5a3, #c9a96e);
    margin: 0 auto 20px;
    box-shadow: 0 0 30px rgba(232,213,163,0.4), 0 0 60px rgba(232,213,163,0.2);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 30px rgba(232,213,163,0.4), 0 0 60px rgba(232,213,163,0.2); }
    50% { box-shadow: 0 0 50px rgba(232,213,163,0.6), 0 0 80px rgba(232,213,163,0.3); }
  }
  .badge {
    display: inline-block;
    background: #1e3a5f;
    color: #7eb8da;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
    border: 1px solid rgba(126,184,218,0.3);
  }
  .title { color: #f5f5f5; font-size: 22px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .subtitle { color: #a0b4c8; font-size: 14px; margin-bottom: 24px; }
  .desc { color: #7a8fa8; font-size: 13px; line-height: 1.7; margin-bottom: 28px; }
  .btn-group { display: flex; flex-direction: column; gap: 12px; }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 20px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-qq { background: #11cd6e; color: #fff; }
  .btn-qq:hover { background: #0ebc5f; }
  .btn-netease { background: #dd3e3e; color: #fff; }
  .btn-netease:hover { background: #c93030; }
  .btn-kugou { background: #ff8c00; color: #fff; }
  .btn-kugou:hover { background: #e67d00; }
  .icon { width: 22px; height: 22px; }
  .footer { color: #4a6080; font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="moon"></div>
  <div class="badge">34TH ANNIVERSARY</div>
  <div class="title">Man on the Moon</div>
  <div class="subtitle">R.E.M. · Automatic for the People · 1992</div>
  <div class="desc">1992年10月13日发行 · 纪念安迪·考夫曼<br>Billboard Hot 100 第30 · 格莱美提名</div>
  <div class="btn-group">
    <a class="btn btn-qq" href="https://y.qq.com/n/ryqq/songDetail/0007HQ4v0oaAZH">
      <svg class="icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      QQ音乐
    </a>
    <a class="btn btn-netease" href="https://music.163.com/song?id=20282682">
      <svg class="icon" viewBox="0 0 24 24" fill="#fff"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      网易云音乐
    </a>
  </div>
  <div class="footer">每日乐说 · 欧美 · 1990s</div>
</div>
</body>
</html>
