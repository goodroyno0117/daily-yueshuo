<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>胡夏《那些年》| 每日乐说</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;padding:20px;color:#f5f5f5}
.container{background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,0.1);padding:40px 36px;max-width:420px;width:100%;text-align:center}
.song-title{font-size:32px;font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-1px;line-height:1.1}
.song-subtitle{font-size:16px;color:#8ab4f8;margin-bottom:24px;font-weight:500}
.cover{width:180px;height:180px;border-radius:16px;object-fit:cover;margin:0 auto 24px;box-shadow:0 8px 32px rgba(0,0,0,0.4);border:2px solid rgba(255,255,255,0.1)}
.quote{background:rgba(255,255,255,0.05);border-left:3px solid #8ab4f8;padding:14px 18px;border-radius:0 12px 12px 0;margin-bottom:28px;text-align:left}
.quote p{font-size:14px;line-height:1.8;color:#c8d6e5;font-style:italic}
.btn-group{display:flex;flex-direction:column;gap:14px}
.btn{ display:flex;align-items:center;justify-content:center;gap:10px;padding:16px 24px;border-radius:50px;font-size:16px;font-weight:700;text-decoration:none;transition:all 0.3s ease;color:#fff }
.btn-qq{background:linear-gradient(135deg,#11c03a,#0a8f2a)}
.btn-netease{background:linear-gradient(135deg,#c20c2a,#a00a20)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,0.3)}
.btn-icon{font-size:22px}
.btn-text{font-size:14px}
.footer{margin-top:28px;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px}
</style>
</head>
<body>
<div class="container">
  <img class="cover" src="https://p2.music.126.net/TYvdO3LSN5VxGxHzX4eLWA==/109951169782186766.jpg" alt="cover" onerror="this.style.display='none'">
  <h1 class="song-title">那些年</h1>
  <p class="song-subtitle">胡夏 · 2011</p>
  <div class="quote">
    <p>「那些年错过的大雨，那些年错过的爱情，<br>好想拥抱你，拥抱错过的勇气。」</p>
  </div>
  <div class="btn-group">
    <a class="btn btn-qq" href="https://y.qq.com/n/ryqq/songDetail/000X26xH2d2TiD">
      <span class="btn-icon">&#9835;</span>
      <span class="btn-text">QQ 音乐 · 一键播放</span>
    </a>
    <a class="btn btn-netease" href="https://music.163.com/song?id=97357">
      <span class="btn-icon">&#9835;</span>
      <span class="btn-text">网易云音乐 · 一键播放</span>
    </a>
  </div>
  <p class="footer">每日乐说 · 2011 → 2026 · 15周年</p>
</div>
</body>
</html>
