<!DOCTYPE html>

<title>Roll With It - Oasis | 每日乐说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { background: #fff; border-radius: 20px; padding: 36px 28px 32px; max-width: 380px; width: 100%;

  .platforms { display: flex; flex-direction: column; gap: 12px; }
  .platform-btn { display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px; border-radius: 14px; text-decoration: none; font-size: 16px; font-weight: 700;
    transition: transform 0.15s, box-shadow 0.15s; }
  .platform-btn:active { transform: scale(0.97); }
  .btn-qq { background: linear-gradient(135deg, #31c27c, #24b36b); color: #fff; box-shadow: 0 4px 16px rgba(49,194,124,0.3); }
  .btn-netease { background: #fff; color: #ec4141; border: 2px solid #ec4141; box-shadow: 0 4px 16px rgba(236,65,65,0.1); }

  .footer { margin-top: 24px; font-size: 11px; color: #9CA3AF; letter-spacing: 0.5px; }
  .note { margin-top: 14px; font-size: 11px; color: #9CA3AF; line-height: 1.6; }
</style>
</head>
<body>
<div class="card">

  <div class="song-title">Roll With It</div>
  <div class="artist">Oasis · (What&#39;s The Story) Morning Glory?</div>
  <div class="platforms">

</div>
