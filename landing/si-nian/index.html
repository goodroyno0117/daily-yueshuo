<!DOCTYPE html>

<title>毛阿敏 - 思念 | 每日乐说</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: radial-gradient(ellipse at top, #1b2a3a 0%, #0d1620 55%, #070b11 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: rgba(255,255,255,0.97);
    border-radius: 20px; padding: 38px 28px 34px;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    text-align: center;
  }
  .badge {
    display: inline-block; background: #B5462E; color: #fff;
    font-size: 11px; font-weight: 700; padding: 3px 12px;
    border-radius: 20px; letter-spacing: 2px; margin-bottom: 16px;
  }
  .song-title { font-size: 21px; font-weight: 900; color: #111827; margin-bottom: 4px; line-height: 1.35; }
  .artist { font-size: 15px; color: #6B7280; margin-bottom: 8px; }
  .note { font-size: 12px; color: #9CA3AF; margin-bottom: 26px; line-height: 1.6; }
  .platforms { display: flex; flex-direction: column; gap: 12px; }
  .platform-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 16px 20px; border-radius: 14px;
    font-size: 16px; font-weight: 700; color: #fff; text-decoration: none;
    transition: transform .15s ease;
  }
  .platform-btn:active { transform: scale(0.97); }
  .qq { background: linear-gradient(135deg,#1ec8ff,#1a8cff); }
  .netease { background: linear-gradient(135deg,#ff5a5f,#e60026); }
  .footer { margin-top: 24px; font-size: 11px; color: #B0B8C0; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card">
    <span class="badge">每日乐说 · 大陆 × 1980s</span>
