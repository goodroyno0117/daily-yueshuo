<style>

  .btn{display:flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:600;
    text-decoration:none;margin-bottom:14px;transition:transform .15s,box-shadow .15s}
  .btn:active{transform:scale(.98)}
  .btn-qq{background:linear-gradient(135deg,#3ac25b,#1db954);color:#fff;
    box-shadow:0 8px 24px rgba(29,185,84,.35)}
  .btn-netease{background:linear-gradient(135deg,#e23a3a,#c81f1f);color:#fff;
    box-shadow:0 8px 24px rgba(226,58,58,.35)}
  .ic{font-size:20px}
  .tip{font-size:12px;color:#6f7aa6;margin-top:26px;line-height:1.6}
